# EMtrace default configuration
# Environment variables: $data, $databases, $hostgenomes


# Preprocess settings (emtrace run -p preprocess)
# Three sub-steps run in order: porechop → chop → flt
# Each sub-step is activated by including pore/chop/flt in the pipeline.
preprocess:
  # Optional read subsampling applied before any preprocessing step
  subsample:
    active: false
    size: 10000              # fraction (0.0–1.0) or absolute count (>1)

  # Step 1: Adapter removal (Porechop_ABI, fallback to Porechop)
  # emtrace run -p pore
  porechop_abi:
    verbosity: 1                        # output detail: 0=none, 1=some, 2=lots, 3=full
    # ab initio options
    ab_initio: false                    # infer adapters from reads (recommended)
    custom_adapters: null               # path to custom adapter file, null = skip
    discard_database: false             # ignore built-in adapter database
    window_size: 3                      # smoothing window for drop-cut algorithm
    # consensus mode options
    number_of_run: 10                   # sampling iterations for initial consensus
    consensus_run: 20                   # additional runs if no stable consensus found
    all_above_x: 10                     # min % of total adapters for consensus selection
    best_of_x: 0                        # keep only best N consensus seqs, 0 = all
    # adapter search
    adapter_threshold: 90.0             # min % identity to label adapter as present
    check_reads: 10000                  # reads sampled for adapter detection
    scoring_scheme: '3,-6,-5,-2'        # alignment scores: match,mismatch,gap-open,gap-extend
    # end adapter trimming
    end_size: 150                       # bp searched at each read end for adapters
    min_trim_size: 4                    # ignore adapter alignments smaller than this
    extra_end_trim: 2                   # extra bases removed next to end adapters
    end_threshold: 75.0                 # min % identity for end adapter removal
    # middle adapter settings
    no_split: true                      # skip splitting reads at middle adapters
    discard_middle: false               # discard reads with middle adapters instead of splitting
    middle_threshold: 90.0              # min % identity for middle adapter detection
    extra_middle_trim_good_side: 10     # extra bases removed on good side of middle adapter
    extra_middle_trim_bad_side: 100     # extra bases removed on bad side of middle adapter
    min_split_read_size: 400            # min bp for post-split read pieces
  # Step 2: Quality / length filtering (Chopper)
  # emtrace run -p chop
  chopper:
    quality: 10                         # min Phred average quality score
    minlength: 400                      # min read length (bp)
    maxlength: 0                        # max read length (bp), 0 = no limit
    contam: null                        # path to contaminant FASTA, null = skip
    trim_approach: 'trim-by-quality'    # fixed-crop|trim-by-quality|best-read-segment|split-by-low-quality
    cutoff: 10                          # quality threshold for end trimming
    headcrop: 0                         # trim N bases from read start
    tailcrop: 0                         # trim N bases from read end
  # Step 3: Host / background read filtering
  # emtrace run -p flt
  bgfilter:
    bgfilter: 'Homo_sapiens'            # CSV of host genomes to filter against
    minimap:
      c: true
      m: 80                             # minimap chain threhold
      s: 100                             # minimap DP alignemnt score threshold
      k: 0                              # k-mer size (-k); 0 = minimap/index default (15)
      w: 0                              # minimizer window (-w); 0 = minimap/index default (10)
      save_mmi_index: true              # build and reuse *.mmi index alongside the FASTA
      params: ''                        # additional parameters

# read annotation settings
annotation:
  # Keep only each read's top-scoring hits (ties retained) after every search.
  # false (default): keep all hits (bounded by max_target_seqs / minimap -N) so
  # EM can weigh near-best alternatives. true: top hits only; EM then splits
  # exact ties and em.temp has no effect. Read partitions and the annotation and
  # abundance tables use top hits either way. CLI: --tophits sets true.
  filter_tophits: false
  blastn:
    bitscore: 100
    evalue: 10
    max_target_seqs: 5
    save_hits: false            # write raw BLAST tabular to disk for debugging
  minimap:
    s: 100                      # min DP alignment score (-s, AS:i:, only effective when c: true)
    m: 100                       # -m chain score threshold (always applied)
    c: true                     # false=fast chain-only (s1:i: score); true=full DP alignment (AS:i: score, 2-5x slower)
    f: 0.0002                   # -f ignore top FLOAT fraction of most frequent minimizers (0.0002-)
    k: 0                        # -k k-mer size (0 = preset default ~15; try 11 or 13 for divergent viruses)
    w: 0                        # -w minimizer window size (0 = preset default; try 5 or 7 when lowering k)
    evalue: 10
    max_target_seqs: 5
    preset: "map-ont"
    secondary: "yes"
    K: "500M"                   # -K minibatch size (bases); minimap2 default 500M. Lower (e.g. "100M") to cut peak RAM on large-index searches
    save_hits: false            # write raw PAF to disk for debugging
  # diamond blastp/blastx
  diamond_blastp:
    bitscore: 80                # benchmarked chain2 value; short nanopore ORFs score low
    evalue: 10
    mode: 'very-sensitive'
    max_target_seqs: 5
    save_hits: false            # write raw Diamond tabular to disk for debugging
  orfipy:
    min_len: 90                 # min ORF length (nt); benchmarked chain2 value
    max_len: INF
    table: 1
    partial_5: False
    partial_3: True
    strand: 'b'
  ann1: ''
  ann2: ''
  anns: 'abv.1g'
  anns.options:
    abv:             "--ann1 minimap.refseq.abv"
    abv.1g:          "--ann1 minimap.refseq.abv.1g"
    vi.2round:       "--ann1 minimap.refseq.vi --ann2 vi:blastn.refseq.abv"
    vi.2round1g:     "--ann1 minimap.refseq.vi --ann2 vi:blastn.refseq.abv.1g"
    vi.chain1:       "--ann1 minimap.refseq.abv,diamond.nrclust.vi"
    vi.chain2:       "--ann1 minimap.refseq.abv.1g,diamond.uniref.vi"
    vi.chain3:       "--ann1 minimap.genbank.vi+refseq.abv.1g,diamond.uniref.vi"
    16S.silva:       "--ann1 minimap.silva"
    16S.rrnDB:       "--ann1 minimap.rrnDB"
    16S.rrnDB.dedup: "--ann1 minimap.rrnDB.dedup"
    16S.emu:         "--ann1 minimap.emu"

# em (EM abundance estimation)
em:
  temp: 1.0              # EM temperature parameter (likelihood smoothing)
  max_iter: 1000         # max EM iterations
  log_L_threshold: 0.01  # convergence threshold (log-likelihood change)
  # exclude reads whose assigned taxpath has no resolved binomial species
  # (tests the `species` rank, not the subject accession)
  exclude_no_species: false
  # two-pass EM (as Emu): after the first EM, drop taxa with fewer expected
  # reads than this and re-run the EM so their reads are re-assigned; 0 = one pass
  prune_min_reads: 0


# assembly settings
assembly:
  bgfilter: 'Homo_sapiens'            # CSV of host genomes to filter against
  database: "minimap.assembly"
  minimap:                            # read-to-reference mapping (tuned for divergent samples)
    c: true                           # base-level alignment
    m: 0                              # -m chain score threshold; 0 = minimap2 default (40)
    s: 0                              # -s DP alignment score threshold; 0 = minimap2 default (40)
    k: 11                             # -k k-mer size (minimap2 map-ont default 15)
    w: 5                              # -w minimizer window (default 10)
    secondary: false                  # keep secondary alignments (--secondary=yes, up to -N n)
    n: 5
  refseqs:                  ""  # CSV of fasta for refbased assembly
  refaccs:                  ""  # CSV of Entrez accessions for refbased assembly
  # variant calling and consensus
  min_coverage:             10     # min depth; below this the position is masked with N
  min_af:                   0.5   # AF an allele must EXCEED to be written into the consensus
  report_min_af:            0.2   # AF an allele must REACH to be listed in the variant table
  min_ac:                   5     # min reads supporting an allele (applies to both outputs)
  vcf_flt:                  ""    # optional extra bcftools expression, ANDed into both filters
  # automatic reference selection (used when refseqs and refaccs are empty)
  ref_auto:
    enabled:              false  # pick references from the reads' hits; CLI --ref_auto
    min_reads:            10     # min distinct reads for a species / for an extra accession (segment)
    min_read_frac:        0.01   # min share of viral reads for a species
    max_species:          3      # co-infections: at most this many species
    max_refs_per_species: 8      # segments per species (greedy read cover)
    quality_metric:       qcov_identity  # qcov_identity | pident_qcov | bitscore | bits_per_base | reads_won
    secondary_margin:     1.0    # how much better a secondary (annotation) pick must align to replace a primary one
    use_assembly_db:      true   # primary source: search assembly.database (RefSeq viral)
    use_annotation:       true   # secondary source: annotation hits (annot2/annot1)
    minimap:
      k:                  0      # 0 = index default; 11 (with w 5) for divergent samples, slower
      w:                  0
  # consensus polishing with medaka (ONT single-end only). The reads used for the
  # draft are re-mapped to it, polished, then re-masked below min_coverage.
  medaka:
    enabled:              true   # CLI --medaka / --no-medaka; skipped with a warning if medaka is not installed
    model:                auto   # auto = basecaller model from read headers; or a medaka model name; CLI --medaka_model
    fallback_model:       ""     # used by auto when headers carry no model; "" = medaka default (r1041 400bps sup)
    path:                 ""     # medaka executable or its bin/ dir (e.g. ~/miniconda3/envs/medaka/bin); "" = PATH
    batch_size:           100    # medaka inference batch size (lower if GPU memory runs out)
    cpu:                  false  # force inference on the CPU


# reporting settings
report:
  min_qcov: 0                      # min query coverage (fraction 0-1) for annotation/abundance tables; unknown qcov (minimap2 without -c) is not filtered
  min_bitscore: 0                   # min bitscore for annotation/abundance tables
  # Cumulative-share tail trim, FRACTION: 0.01 drops the smallest taxa that together hold the last
  # 1% of reads. Ranks on readn_em when EM ran, else readn. Computed on the abundance table and
  # propagated to annot_table, sorted reads, stats and plots, so every report agrees on what was
  # detected; reads of trimmed taxa count as unmapped in batch roll-ups. The raw
  # annotation/annot*.tsv tables are never filtered. Intended for 16S profiling -- see the shipped
  # profile, `emtrace run --profile 16S`. Unrelated to preprocess.chopper.tailcrop (read-end
  # base trimming).
  tail: 0
  # true also trims the viral division. Leave false unless you know the viral tail is noise: it is
  # where rare true positives live, so trimming it is NOT recommended for virus discovery. Note
  # viral reads count toward the share denominator either way, so on a virus-dominated library even
  # a small tail can remove much of the non-viral background. No effect when tail is 0.
  tail_viruses: false
  # drop taxa with no resolved binomial species (empty, or "{genus} sp."/cf./aff./
  # uncultured/unclassified) from reports/annot_table.tsv + abund_table.tsv.
  # Independent of em.exclude_no_species, which filters only the EM input.
  # The raw annotation/annot*.tsv tables are never filtered.
  exclude_no_species: false
  export_excel: true                # export annot/abund tables as .xlsx (requires openpyxl)
  sort_reads: false                  # sort reads into taxonomy directory hierarchy
  toptaxrank: "auto"                # top taxonomy rank for read sorting; "auto" detects from annotation db column
  # abundance plots generated during reporting (plot step)
  sankey: true                      # generate Sankey diagram (sankey.html/.png)
  sunburst: true                    # generate sunburst chart (sunburst.html/.png)
  stacked_bar: true                 # generate stacked bar chart (stacked_bar.html/.png)
  heatmap_genus: false              # generate genus-level heatmap (heatmap_genus.pdf)
  heatmap_species: false            # generate species-level heatmap (heatmap_species.pdf)
  # invertebrate genera classified as parasites/pathogens by `batch-abundance`
  # (splits the NCBI "Invertebrates" division into parasites vs other). Edit to
  # extend; this list is the built-in default.
  parasite_genera:
    # Apicomplexa / protozoa
    - Babesia
    - Theileria
    - Cytauxzoon
    - Hepatozoon
    - Plasmodium
    - Hepatocystis
    - Trypanosoma
    - Leishmania
    - Eimeria
    - Cystoisospora
    - Cryptosporidium
    - Toxoplasma
    - Neospora
    - Sarcocystis
    - Entamoeba
    - Giardia
    # Trematodes
    - Dicrocoelium
    - Fasciola
    - Schistosoma
    - Paramphistomum
    - Calicophoron
    # Nematodes
    - Haemonchus
    - Trichostrongylus
    - Ostertagia
    - Cooperia
    - Oesophagostomum
    - Strongyloides
    - Ascaris
    - Toxocara
    - Trichuris
    - Bunostomum
    - Nematodirus
    - Onchocerca
    - Dirofilaria
    - Setaria
    - Nippostrongylus
    # Cestodes
    - Taenia
    - Echinococcus
    - Moniezia
    - Dipylidium
    - Hymenolepis

# -----------------------------------------------------------------------------
# Statistics step settings
# -----------------------------------------------------------------------------
stats:
  output_format: "csv"         # output format for stats file: "csv" or "yaml"
  plot_histograms: true        # generate read-length histogram plots (requires matplotlib)

# -----------------------------------------------------------------------------
# Runtime settings
# Override threads on CLI: -t N
# -----------------------------------------------------------------------------
runtime:
  num_threads: 8           # Threads for BLAST, Diamond
  output_root: results     # Root directory for all reference sets (-o/--outdir default)
  temp_dir: $TMPDIR        # Temp file directory (macOS/Linux system temp)
  entrez_email: "your.email@example.org"  # Required for NCBI Entrez accession fetch (assembly.refaccs)
  mode: online             # online: fall back to Entrez when ref not in local DB; offline: abort with warning

# -----------------------------------------------------------------------------
# Output/Pack format
# -----------------------------------------------------------------------------
output:
  fasta_wrap: false        # false = single-line FASTA (default); true = wrapped
  fasta_line_width: 80     # Characters per line when fasta_wrap is true
  pack_reads: 0            # Include all reads (FASTQ) in the packed *.tar.gz
  pack_reads_vi: 1         # Include viral reads (FASTQ) in the packed *.tar.gz
  pack_assembly_bam: 0     # Include assembly BAM + index in the packed *.tar.gz
  realtime_abund_table: true  # Write abund_table.tsv after each realtime batch

# -----------------------------------------------------------------------------
# Database paths
# Default subpaths are resolved under $EMTRACE_DB_DIR when set.
# Override individual paths here when they differ from the defaults.
# -----------------------------------------------------------------------------
databases:
  # All paths default to $EMTRACE_DB_DIR/<subpath> when EMTRACE_DB_DIR is set.
  #
  ## genomic database for ref-based assembly
  minimap.assembly:
    search: minimap
    db: $EMTRACE_DB_DIR/minimap.refseq.vi.fa
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/minimap.refseq.vi.234.mmi.tar.gz"
  ## genomic databases:
  minimap.refseq.abv:
    search: Minimap2
    db: $EMTRACE_DB_DIR/minimap.refseq.abv.fa
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/minimap.refseq.abv.234.tar.gz"
  minimap.refseq.abv.1g:
    search: Minimap2
    db: $EMTRACE_DB_DIR/minimap.refseq.abv.1g.fa
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/minimap.refseq.abv.1g.234.mmi.tar.gz"
  minimap.refseq.abv.1g.k11w5:
    search: Minimap2
    db: $EMTRACE_DB_DIR/minimap.refseq.abv.1g.k11w5.fa.mmi
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/minimap.refseq.abv.1g.k11w5.234.mmi.tar.gz"
  minimap.genbank.vi+refseq.abv.1g:
    search: Minimap2
    db: $EMTRACE_DB_DIR/minimap.genbank_vi+refseq_abv1g.fa.mmi
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/minimap.genbank_vi+refseq_abv1g.20260507+234.mmi.tar.gz"
  minimap.refseq.vi:
    search: Minimap2
    db: $EMTRACE_DB_DIR/minimap.refseq.vi.fa
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/minimap.refseq.vi.234.mmi.tar.gz"
  blastn.refseq.abv:
    search: Blastn
    db: $EMTRACE_DB_DIR/blastn.refseq.abv
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/blastn.refseq.abv.234.tar.gz"
  blastn.refseq.abv.1g:
    search: Blastn
    db: $EMTRACE_DB_DIR/blastn.refseq.abv.1g
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/blastn.refseq.abv.1g.234.tar.gz"
  blastn.refseq.vi:
    search: Blastn
    db: $EMTRACE_DB_DIR/blastn.refseq.vi
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/blastn.refseq.vi.234.tar.gz"
  #blastp.nrclust.vi:
  #  search: Blastp
  #  db: $EMTRACE_DB_DIR/nr_cluster_seq.vi
  #  url: "https://a3s.fi/swift/v1/lazypipe-db/2026/blastp.nrclust.vi.v20260311.tar.gz"
  #blastp.uniref.vi:
  #  search: Blastp
  #  db: $EMTRACE_DB_DIR/blastp.uniref100.vi
  #  url: "https://a3s.fi/swift/v1/lazypipe-db/2026/blastp.uniref100.vi.v2026_01.tar.gz"
  diamondp.uniref100.abv:
    db:     "$EMTRACE_DB_DIR/diamond.uniref100.abv.2024_11_27.dmnd"
    name:   "uniref100.abv.2024_11_27"
    search: "diamondp"
    url:    "https://a3s.fi/lazypipe-db/diamond.uniref100.abv.2024_11_27.dmnd.tar.gz"
  diamond.nrclust.vi:
    search: "Diamondp"
    db: $EMTRACE_DB_DIR/nr_cluster_seq.vi.dmnd
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/diamond.nrclust.vi.v20260311.dmnd.gz"
  diamond.uniref.vi:
    search: "Diamondp"
    db: $EMTRACE_DB_DIR/diamond.uniref100.vi.dmnd
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/diamond.uniref100.vi.v2026_01.dmnd.gz"
  ## 16S databases:
  minimap.silva:
    search: Minimap2
    db: $EMTRACE_DB_DIR/minimap.SILVA_SSURef.fasta
    group: 16S
    taxonomy: SILVA
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/minimap.SILVA_144_SSURef.tar.gz"
  minimap.rrnDB.dedup:
    # rrnDB 5.10 de-duplicated (one representative per named species, else genus,
    # else family, per cluster of identical sequences); Lazypipe-db db_emu_dedup.bash.
    # 78,966 sequences against full rrnDB's 265,316. The best NCBI-taxonomy cell of
    # the 16S benchmark -- see the shipped 16S profile and the EMtrace manuscript.
    search: Minimap2
    db: $EMTRACE_DB_DIR/minimap.rrnDB_16S_rRNA.dedup.fasta.mmi
    group: 16S
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/minimap.rrnDB-5.10_16S_rRNA.dedup.tar.gz"
  minimap.emu:
    # Emu's own prebuilt database, repackaged unchanged (Lazypipe-db
    # db_16S.py --target emu): 49,243 sequences, 17,555 species, 74.1 Mbp.
    # rrnDB 5.6 + NCBI 16S RefSeq, dereplicated to one sequence per species by
    # the Emu authors (Curry et al. 2022). Copy dated 2022-02-11.
    # This exists so EMtrace can be scored against Emu on the same
    # sequences: a difference between the two is then a method difference, not
    # a database difference. Do not rebuild or re-dereplicate it.
    # Sequence names are Emu's "<taxid>:emu_db:<n>", so the acc2taxid map is
    # derived from the headers and needs no NCBI lookup.
    search: Minimap2
    db: $EMTRACE_DB_DIR/minimap.emu.fasta.mmi
    group: 16S
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/minimap.emu.default.v20220211.tar.gz"
  minimap.rrnDB:
    search: Minimap2
    db: $EMTRACE_DB_DIR/minimap.rrnDB_16S_rRNA.fasta.mmi
    group: 16S
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/minimap.rrnDB-5.10_16S_rRNA.tar.gz"
  minimap.refseq16S:
    search: Minimap2
    db: $EMTRACE_DB_DIR/minimap.refseq.16SrRNA.fna.mmi
    group: 16S
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/minimap.refseq.16SrRNA.v20260911.tar.gz"
  blastn.silva:
    search: Blastn
    db: $EMTRACE_DB_DIR/blastn.SILVA_SSURef
    group: 16S
    taxonomy: SILVA
    url: "https://a3s.fi/swift/v1/lazypipe-db/2026/blastn.SILVA_144_SSURef.tar.gz"

# Taxonomy sources. There is no taxonomy switch: each annotation round reports
# through its database's taxonomy. SILVA databases (name contains "silva", or
# `taxonomy: SILVA` on the database entry) use SILVA taxonomy; all others NCBI.
taxonomy:
  ncbi:
    toptaxrank: "division"
    taxgroups: "all"
    db: $EMTRACE_DB_DIR/taxonomy/ncbi/taxonomy.db
    url: "ftp://ftp.ncbi.nlm.nih.gov/pub/taxonomy/taxdump.tar.gz"
  silva:
    toptaxrank: "domain"
    taxgroups: "all"
    db: $EMTRACE_DB_DIR/taxonomy/silva/taxonomy.db
    # NB: release 144 drops the underscore before the version (…ref144, not …ref_144)
    url: "https://ftp.arb-silva.de/release_144/Exports/taxonomy/taxmap_slv_ssu_ref144.txt.gz"
    # SILVA's per-path rank declarations. Required from release 144 on: 144
    # inserted a "kingdom" level, so positional rank assignment shifts every
    # rank down one and lands the family name in the genus column.
    tax_slv_url: "https://ftp.arb-silva.de/release_144/Exports/taxonomy/tax_slv_ssu_144.txt.gz"
    # taxmap_slv: $EMTRACE_DB_DIR/taxonomy/silva/taxmap_slv_ssu_ref144.txt
    # tax_slv:    $EMTRACE_DB_DIR/taxonomy/silva/tax_slv_ssu_144.txt

# -----------------------------------------------------------------------------
# Host Databases, for Minimap2, Genomic + RNA directly from NCBI
# Indexed on the first usage by Minimap2
# -----------------------------------------------------------------------------
host.databases:
  kitome:
    db: $EMTRACE_DB_DIR/host/kitome/kitome.fasta.gz
    name: Laboratory protocol associated sequences (kitome)
    search: minimap2
    url: https://a3s.fi/swift/v1/lazypipe-db/2026/kitome.20260507.tar.gz
  Aedes_aegypti:
    accession: "GCF_002204515.2"
    db: "$EMTRACE_DB_DIR/hostgenomes/GCF_002204515.2_genomic+rna.fna.gz"
    search: "Minimap2"
    urls:
    - "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/002/204/515/GCF_002204515.2_AaegL5.0/GCF_002204515.2_AaegL5.0_genomic.fna.gz"
    - "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/002/204/515/GCF_002204515.2_AaegL5.0/GCF_002204515.2_AaegL5.0_rna.fna.gz"
  Aedes_albopictus:
    accession: "GCF_035046485.1"
    db: "$EMTRACE_DB_DIR/hostgenomes/GCF_035046485.1_genomic+rna.fna.gz"
    search: "Minimap2"
    urls:
    - "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/035/046/485/GCF_035046485.1_AalbF5/GCF_035046485.1_AalbF5_genomic.fna.gz"
    - "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/035/046/485/GCF_035046485.1_AalbF5/GCF_035046485.1_AalbF5_rna.fna.gz"
  Bos_taurus:
    accession: "GCF_002263795.3"
    db: "$EMTRACE_DB_DIR/hostgenomes/GCF_002263795.3_genomic+rna.fna.gz"
    search: "Minimap2"
