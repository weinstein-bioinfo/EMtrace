# 16S rRNA amplicon profiling profile.
#
#   emtrace run --profile 16S ...
#   emtrace watch --profile 16S ...
#   GUI: Config page, Profile: 16S
#
# Overlaid on default.yaml (EMtraceConfig.from_profile): only the keys that
# differ are listed, so databases and taxonomy are inherited.
# Mappings merge key by key; scalars and lists replace wholesale.
#
# The settings below are the configuration of the 16S benchmark --
# de-duplicated rrnDB, 25 secondary alignments, all hits kept for the EM, EM
# temperature 10, minimap2 -s 200 -m 80, read splitting at middle adapters, no
# host filtering -- see the EMtrace manuscript (16S benchmark). One addition:
# the 1 % tail trim below, which the benchmark applied at scoring rather than
# in the pipeline.

report:
  # ON here. Full-length 16S against a 16S database produces a long tail of
  # single-read neighbours: on the ZymoBIOMICS mock this trim is the whole
  # difference between species precision 0.40 and 1.00, at every batch of the
  # run, without moving L1 (EMtrace manuscript, 16S benchmark).
  tail: 0.01
  # Viruses keep their exemption, as in the benchmark configuration. A 16S
  # database holds no viral sequences, so this changes nothing in practice.
  tail_viruses: false

annotation:
  anns: 16S.rrnDB.dedup
  minimap:
    max_target_seqs: 25             # -N 25: more sub-best hits for the EM to weigh
    s: 200                          # DP score floor of the benchmarked cell
    m: 80                           # chaining score floor of the benchmarked cell

em:
  temp: 10.0                        # softer score -> probability conversion

preprocess:
  # Amplicons need no host filtering: the benchmark ran without it.
  bgfilter:
    bgfilter: '0'
  porechop_abi:
    no_split: false                 # split reads at middle adapters (chimeric amplicons)
    min_split_read_size: 200
  chopper:
    quality: 10
    minlength: 1200                 # full-length 16S is ~1.5 kb; cut the fragments
    maxlength: 1800
